name: Run tests

on:
  workflow_dispatch:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ctsit/redcapcustodian:latest

    env:
      CI: "TRUE"
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v2

      - name: Check
        run: devtools::test(stop_on_failure = TRUE)
        shell: Rscript {0}
